services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "8000:5000"
    volumes:
      # Source is bind-mounted so the Flask reloader picks up changes.
      # The SQLite database lives in ./instance on the host.
      - .:/app
    environment:
      SECRET_KEY: dev-only-change-me
      SHEEP_JOURNAL_TZ: Europe/Stockholm
